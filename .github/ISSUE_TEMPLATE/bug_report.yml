name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove private data, images, paths, and checkpoint files before posting.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and reproduction
      description: Include expected behavior, actual behavior, and a minimal weight-free reproduction when possible.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python, operating system, backend, and relevant package versions.
    validations:
      required: true

